[general]
framerate = 30
bars = 24
autosens = 1
sensitivity = 100

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
mono_option = average
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
integral = 0.72
monstercat = 1
waves = 0
gravity = 1.4
ignore = 0
