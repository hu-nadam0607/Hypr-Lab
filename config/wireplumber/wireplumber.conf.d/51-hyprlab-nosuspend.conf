# Hypr-Lab: keep local ALSA audio outputs awake for immediate UI sounds.
# This avoids the first short notification sound being lost while the sink wakes.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
